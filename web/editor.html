<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1418">
  <meta name="description" content="Ashfall Sprite Workshop: an offline-capable C++17 and Raylib pixel-art editor. Paint, fill, mirror, transform and export transparent PNG sprites. No uploads.">
  <title>Sprite Workshop — Ashfall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1418'/%3E%3Cpath d='M8 20L20 8l4 4-12 12H8z' fill='%23dab270'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f1418; }
    #editor-root { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100% !important; height: 100% !important; border: 0; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1418; color: #dab270; pointer-events: none; font-family: ui-monospace, monospace; }
    #loading.done { opacity: 0; visibility: hidden; }
    h1 { font: 400 26px/1.5 ui-monospace, monospace; letter-spacing: .08em; margin: 12px 0 20px; color: #e4e8dc; }
    #status { color: #889797; font-size: 11px; text-align: center; padding: 0 24px; }
    .mark { width: 32px; height: 32px; border: 3px solid #dab270; transform: rotate(-45deg); }
    .fallback { position: fixed; top: 30%; width: 100%; text-align: center; color: #e4e8dc; font-family: sans-serif; }
    a { color: #dab270; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="editor-root">
    <canvas id="canvas" tabindex="0" aria-label="Sprite Workshop pixel art editor. B pencil, E eraser, F fill, I color picker, L line, R rectangle. Control or Command Z undo, S save PNG or equipment project, O open file. Built-in Gear opens editable equipment. G grid, M mirror, H help. Mouse wheel to zoom; Space and drag to pan." oncontextmenu="event.preventDefault()"></canvas>
    <input id="png-file" type="file" accept="image/png,.png,.ashgear" aria-label="Open a PNG or equipment project">
    <div id="loading" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>SPRITE WORKSHOP</h1>
      <div id="status">SETTING OUT THE PIXELS</div>
    </div>
  </div>
  <noscript><div class="fallback">Enable JavaScript, WebGL, and WebAssembly to use the editor. <a href="index.html">Back to Ashfall</a></div></noscript>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) { if (text) document.getElementById('status').textContent = text; },
      onRuntimeInitialized: function () {
        document.getElementById('loading').classList.add('done');
        Module.canvas.focus({ preventScroll: true });
      },
      onAbort: function (reason) {
        document.getElementById('loading').classList.remove('done');
        document.getElementById('status').textContent = 'Unable to start. WebGL and WebAssembly are required. Reload to retry.';
        console.error('Sprite Workshop startup failed:', reason);
      }
    };
    Module.canvas.addEventListener('pointerdown', function () { Module.canvas.focus({ preventScroll: true }); });
    window.addEventListener('keydown', function (event) {
      if (event.target !== Module.canvas) return;
      var shortcut = (event.ctrlKey || event.metaKey) && ['a', 'n', 'o', 's', 'z', 'y'].includes(event.key.toLowerCase());
      if (shortcut || [' ', 'Backspace', 'Delete', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1'].includes(event.key)) event.preventDefault();
    }, { passive: false });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
