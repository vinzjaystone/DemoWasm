name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Game and sprite core (sanitizers ${{ matrix.sanitizers }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: Configure without graphics dependencies
        run: cmake -S . -B build/tests -DASHFALL_BUILD_GAME=OFF -DASHFALL_SANITIZERS=${{ matrix.sanitizers }} -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/tests --parallel 4
      - run: ctest --test-dir build/tests --output-on-failure

  raylib-api:
    name: Renderer API (Raylib ${{ matrix.raylib }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        raylib: ['5.5', '6.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: ${{ matrix.raylib }}
          path: build/raylib-api
          persist-credentials: false
      - name: Compile application sources against the actual Raylib headers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror
          -Isrc -Ibuild/raylib-api/src -DASHFALL_PLAYER_SPRITES=1
          -fsyntax-only src/main.cpp src/renderer.cpp src/character_visual.cpp src/character_animation.cpp src/character_sprites.cpp src/sprite_editor.cpp src/sprite_document.cpp src/equipment_art.cpp src/run_save.cpp src/editor_recovery.cpp src/local_store.cpp

  desktop:
    name: Native desktop build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 4
      - run: ctest --test-dir build/native --output-on-failure

  web:
    name: WebAssembly and real-browser smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Build with read-only diagnostics
        run: |
          emcmake cmake -S . -B build/web -DCMAKE_BUILD_TYPE=Release -DASHFALL_BUILD_TESTS=OFF -DASHFALL_WEB_TEST_API=ON
          cmake --build build/web --parallel 4
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the actual WASM build
        run: |
          python3 tools/serve.py --directory build/web --port 8080 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tests/browser_smoke.mjs
          node tests/character_sprite_smoke.mjs
          SPRITE_SHADER_FAILURE=1 node tests/character_sprite_smoke.mjs
          node tests/sprite_editor_smoke.mjs
          node tests/equipment_art_smoke.mjs
          node tests/persistence_smoke.mjs
      - name: Exercise the procedural player fallback
        run: |
          emcmake cmake -S . -B build/web -DASHFALL_PLAYER_SPRITES=OFF
          cmake --build build/web --parallel 4
          python3 tools/serve.py --directory build/web --port 8080 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          SPRITES_EXPECTED=0 node tests/character_sprite_smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: build/browser/*.png
          if-no-files-found: ignore
      - name: Build release without diagnostics
        run: |
          emcmake cmake -S . -B build/web -DASHFALL_WEB_TEST_API=OFF -DASHFALL_PLAYER_SPRITES=ON
          cmake --build build/web --parallel 4
      - name: Verify production game/editor PNG and equipment workflow without diagnostics
        run: |
          python3 tools/serve.py --directory build/web --port 8080 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tests/release_smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ashfall-web
          path: |
            build/web/index.html
            build/web/index.js
            build/web/index.wasm
            build/web/editor.html
            build/web/editor.js
            build/web/editor.wasm
